name = "mindyards-assistant"
main = "assistant.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# knowledge.md (generated by build.py) is bundled as a string.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
MODEL = "claude-opus-5-5"   # switch to "claude-haiku-5-5" for a cheaper assistant

# 20 questions per minute per visitor IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
